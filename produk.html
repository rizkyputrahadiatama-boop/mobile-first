<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0,  maximum-scale-1.0, user-scalable=no">
        <title>Neweast Gear</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <div class="product-page">
            <header class="product-header">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-chevron-left"></i> 
                </a>
                <h1 class="category-title">Newest Gear</h1>
                <div class="header-spacer"></div>
            </header>
            <main class="product-content">
                <div class="category-banner">
                    <img src="public/banner newes gear.jpg" alt="Banner Promo">
                </div>
                <section class="sub-category-section">
                    <h2 class="section-title">Beauty & Personal Care Category</h2>
                    <div class="product-grid">
                        <div class="product-card">
                            <div class="card-img-wrapper">
                                <img src="public/hairdyer1.jpg" alt="produk 1">
                                <button class="btn-add-badge">+</button>
                            </div>
                            <div class="card-info">
                                <p class="price">Rp420.600</p>
                                <h3 class="name">Remington Hairdyer Travel</h3>
                                <span class="qty-info">1pcs</span>
                            </div>
                        </div>
                        <div class="product-card">
                            <div class="card-img-wrapper">
                                <img src="public/hairdyer2.jpg" alt="Produk2">
                                <button class="btn-add-badge">+</button> 
                            </div>
                            <div class="card-info">
                                <p class="price">Rp504.000</p>
                                <h3 class="name">Tescom Ion Hair Dryer</h3>
                                <span class="qty-info">1pcs</span>
                            </div>
                        </div>
                        <div class="product-card">
                            <div class="card-img-wrapper">
                                <img src="public/hairdyer3.jpg" alt="product3">
                                <button class="btn-add-badge">+</button>
                            </div>
                            <div class="card-info">
                                <p class="price">Rp107.400</p>
                                <h3 class="name">Pandaoma Lint Remover</h3>
                                <span class="qty-info">1pcs</span>
                            </div>
                        </div>
                        <div class="product-card">
                            <div class="card-img-wrapper">
                                <img src="public/catokan.jpg" alt="product4">
                                <button class="btn-add-badge">+</button>
                            </div>
                            <div class="card-info">
                                <p class="price">Rp300.000</p>
                                <h3 class="name">Catokan</h3>
                                <span class="qty-info">1pcs</span>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
