<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Astro Banner</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="hero-banner-container">
        <div class="banner-slider">
            <img src="public/banner5.jpg" alt="banner 1" class="banner-bg-image">
            <img src="public/banner4.jpg" alt="banner 2" class="banner-bg-image">
            <img src="public/banner8.jpg" allt="banner 3" class="banner-bg-image">
            <img src="public/bannerlagi.jpg" alt="banner 4" class="banner-bg-image">
        </div>
            <div class="navbar-overlay">
                <div class="top-bar">
                    <div class="eta-info">
                        <span class="label-tiba">Tiba Dalam</span>
                        <h1 class="waktu-tiba">15 Menit</h1>
                        <p class="sub-info">Buka 24 Jam Dan Tersedia 200 Produk</p>
                    </div>
                    <div class="top-buttons">
                        <button class="btn-chat">
                            <i class="fa-solid fa-headset">Chat CS</i>
                        </button>
                        <button class="btn-menu">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                    </div>
            </div>
            <div class="search-box">
                <i class="fa-solid fa magnifying-glass search-icon"></i>
                <input type="text" placeholder="Cari Produk Disini">
            </div>
        </div>
        <div class="carousel-dots">
            <span class="dot dot-1"></span>
            <span class="dot dot-2"></span>
            <span class="dot dot-3"></span>
            <span class="dot dot-4"></span>
        </div>
    </body>
</html>
