<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Newest Gear</title>
    <link rel="stylesheet" href="produk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <div class="product-page">
            <header class="product-header">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="category-title">Better Rice</h1>
                <a href="keranjang.html" class="cart-icon-wrapper">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <span class="cart-badge">2</span>
                </a>
            </header>
            <main class="product-content">
                <div class="category-banner">
                    <img src="public/rice banner.jpg" alt="banner">
                </div>
                <div class="product-scroll-row">
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/porang.png" alt="porang">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp52.700</p>
                            <h3 class="name">Beras Porang</h3>
                            <p class="qty-info">7sachet</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/bubursoto.jpg" alt="bubur">
                            <button class="btn-add-badge">+</button> 
                        </div>
                        <div class="card-info">
                            <p class="price">Rp32.800</p>
                            <h3 class="name">Bubur Soto Ayam</h3>
                            <p class="qty-info">120gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/buburendang.jpg" alt="bubur">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp32.800</p>
                            <h3 class="name">Bubur Rendang Sapi</h3>
                            <p class="qty-info">120gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/salmonlodeh.jpg" alt="salmonlodeh">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp33.500</p>
                            <h3 class="name">Bubur Salmon Lodeh</h3>
                            <p class="qty-info">120gram</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
