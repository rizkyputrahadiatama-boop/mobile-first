<!DOCTYPE html>

    <head>

        <title>Profile Saya</title>

        <link rel="stylesheet" href="profile.css">

    <body>
        <div class="profile-mobile-container">
            <header class="profile-header">
                <a href="index.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="header-title">Akun Saya</h1>

                    <button class="edit-avatar-btn">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                </div>
                <div class="profile-info">
                    <h2 class="user-name">Ramlan Spakbor</h2>
                    <p class="user-detail"><i class="fa-regular fa-envelope"></i>ramlan.spakbor@email.com</p>
                    <p class="user-detail">0838-7714-3565</p>
                </div>
            </section>
            <nav class="profile-menu-nav">
                <p class="menu-group-title">Pengaturan Akun</p>
                <a href="alamat.html" class="menu-item">
                    <div class="menu-item-left">
                        <i class="fa-solid fa-location-dot menu-icon"></i>
                        <span>Alamat Terpilih</span>

                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>
                <a href="keamanan.html" class="menu-item">
                    <div class="menu-item-left">
                        <i class="fa-solid fa-shield-halved menu-icon"></i>

                    </div>

                </a>
                <a href="bantuan.html" class="menu-item">
                    <div class="menu-item-left">
                        <i class="fa-solid fa-circle-question menu-icon"></i>
                        <span>Pusat Bantuan</span>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>
            </nav>
            <div class="logout-container">
                <button class="btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Keluar Dari Akun</span>
                </button>
            </div>
        </div>
    </body>
</html>
