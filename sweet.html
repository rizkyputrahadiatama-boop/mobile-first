<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Newest Gear</title>
    <link rel="stylesheet" href="produk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <div class="product-page">
            <header class="product-header">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="category-title">Sweet And Break</h1>
                <a href="keranjang.html" class="cart-icon-wrapper">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <span class="cart-badge">2</span>
                </a>
            </header>
            <main class="product-content">
                <div class="category-banner">
                    <img src="public/sweetbanner.png" alt="banner">
                </div>
                <div class="product-scroll-row">
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/kusuka.jpg" alt="kusuka">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp20.800</p>
                            <h3 class="name">Kusuka Balado</h3>
                            <p class="qty-info">160gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/hotcohoco.jpg" alt="hot cokelat">
                            <button class="btn-add-badge">+</button> 
                        </div>
                        <div class="card-info">
                            <p class="price">Rp61.200</p>
                            <h3 class="name">Hot Chocolate</h3>
                            <p class="qty-info">1box</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/pringles.jpg" alt="pringles">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp14.100</p>
                            <h3 class="name">Nori Pringles</h3>
                            <p class="qty-info">42gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/pia100.png" alt="pia100">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp13.600</p>
                            <h3 class="name">PIA100</h3>
                            <p class="qty-info">138gram</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
