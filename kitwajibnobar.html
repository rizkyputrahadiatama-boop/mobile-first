<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Newest Gear</title>
    <link rel="stylesheet" href="produk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <div class="product-page">
            <header class="product-header">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="category-title">Urgent Needs</h1>
                <a href="keranjang.html" class="cart-icon-wrapper">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <span class="cart-badge">2</span>
                </a>
            </header>
            <main class="product-content">
                <div class="category-banner">
                    <img src="public/kitbanner.png" alt="banner">
                </div>
                <div class="product-scroll-row">
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/stopkontak.jpg" alt="stopkontak">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp125.400</p>
                            <h3 class="name">Kenmaster Stop Kontak</h3>
                            <p class="qty-info">1pcs</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/HDMI.jpg" alt="HDMI">
                            <button class="btn-add-badge">+</button> 
                        </div>
                        <div class="card-info">
                            <p class="price">Rp79.400</p>
                            <h3 class="name">Ugreen Kabel HDMI</h3>
                            <p class="qty-info">1pcs</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/batre.jpg" alt="batre">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp60.700</p>
                            <h3 class="name">Energizer Baterai</h3>
                            <p class="qty-info">1pcs</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/apple.jpg" alt="apple">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp99.500</p>
                            <h3 class="name">Wirreles AppleWATCH</h3>
                            <p class="qty-info">1pcs</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
