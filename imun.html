<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Newest Gear</title>
    <link rel="stylesheet" href="produk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <div class="product-page">
            <header class="product-header">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="category-title">Imun On Terus</h1>
                <a href="keranjang.html" class="cart-icon-wrapper">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <span class="cart-badge">2</span>
                </a>
            </header>
            <main class="product-content">
                <div class="category-banner">
                    <img src="public/imun.jpg" alt="banner">
                </div>
                <div class="product-scroll-row">
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/coolvita.jpg" alt="milk">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp31.700</p>
                            <h3 class="name">Milk Calcium</h3>
                            <p class="qty-info">20gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/honeygo.jpg" alt="honey">
                            <button class="btn-add-badge">+</button> 
                        </div>
                        <div class="card-info">
                            <p class="price">Rp37.800</p>
                            <h3 class="name">Honey GO</h3>
                            <p class="qty-info">12sachet</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/Herbilogy.jpg" alt="herbilogy">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp100.500</p>
                            <h3 class="name">Herbilogy Healty</h3>
                            <p class="qty-info">100gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/skin.jpg" alt="skin">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp26.000</p>
                            <h3 class="name">Skin Collagen</h3>
                            <p class="qty-info">10tablet</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
