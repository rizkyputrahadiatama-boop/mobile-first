<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Newest Gear</title>
    <link rel="stylesheet" href="produk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <div class="product-page">
            <header class="product-header">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-chevron-left"></i>
                </a>
                <h1 class="category-title">Sat Set Nobar</h1>
                <a href="keranjang.html" class="cart-icon-wrapper">
                    <i class="fa-solid fa-shopping-cart"></i>
                    <span class="cart-badge">2</span>
                </a>
            </header>
            <main class="product-content">
                <div class="category-banner">
                    <img src="public/bannernobar.png" alt="banner">
                </div>
                <div class="product-scroll-row">
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/bakso.jpg" alt="bakso">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp31.900</p>
                            <h3 class="name">Bakso Ayam</h3>
                            <p class="qty-info">100gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/steak.jpg" alt="steak">
                            <button class="btn-add-badge">+</button> 
                        </div>
                        <div class="card-info">
                            <p class="price">Rp41.900</p>
                            <h3 class="name">Steak Ayam</h3>
                            <p class="qty-info">150gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/sosis.jpg" alt="sosis">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp31.900</p>
                            <h3 class="name">Sosis Ayam</h3>
                            <p class="qty-info">100gram</p>
                        </div>
                    </div>
                    <div class="product-card-horizontal">
                        <div class="card-img-wrapper">
                            <img src="public/dada.jpg" alt="dada">
                            <button class="btn-add-badge">+</button>
                        </div>
                        <div class="card-info">
                            <p class="price">Rp41.900</p>
                            <h3 class="name">Dada Ayam</h3>
                            <p class="qty-info">130gram</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
